name: Daily 100% Free YouTube Automated Publisher

on:
  schedule:
    # 1. Daily Shorts at 8:30 AM EST (12:30 UTC = 6:00 PM IST)
    - cron: '30 12 * * *'
    # 2. Daily Long Video at 2:30 PM EST (18:30 UTC = 12:00 Midnight IST)
    - cron: '30 18 * * *'
  # Allows 1-click manual trigger anytime from GitHub Web UI
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Choose video to generate & publish'
        required: true
        default: 'shorts'
        type: choice
        options:
          - 'shorts'
          - 'longform'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🎬 Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: 'release'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts numpy scipy pillow google-api-python-client google-auth-oauthlib

      - name: 📦 Install Remotion & React Dependencies
        run: |
          cd remotion
          npm install

      - name: 🚀 Run Automated Generation & Render
        run: |
          if [ "${{ github.event.inputs.video_type }}" = "longform" ] || [ "${{ github.event.schedule }}" = "30 18 * * *" ]; then
            echo "🎬 Generating Daily 4-Minute Long-Form Animated Explainer..."
            python generate_longform_voice.py
            python build_explainer_audio.py
            python render_longform_video.py
          else
            echo "📱 Generating Daily High-CPM US Finance Shorts..."
            python generate_reel_pipeline.py --preset random
          fi

      - name: 💾 Save Generated Videos as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-youtube-videos
          path: out/*
          retention-days: 7
